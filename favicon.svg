<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#161f33"/>
    </linearGradient>
    <linearGradient id="gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2.5"/>
  <!-- Center Ambient Radial Glow -->
  <circle cx="64" cy="62" r="32" fill="#38bdf8" opacity="0.18" filter="url(#glow)"/>
  <!-- Diamond / Gem Core -->
  <path d="M64 22 L96 48 L64 104 L32 48 Z" fill="url(#gem)" opacity="0.95"/>
  <!-- Facet Highlights -->
  <path d="M64 22 L64 104 L32 48 Z" fill="#ffffff" opacity="0.15"/>
  <path d="M64 22 L48 48 L64 68 L80 48 Z" fill="#ffffff" opacity="0.3"/>
  <path d="M32 48 L48 48 L64 104 Z" fill="#000000" opacity="0.2"/>
  <path d="M96 48 L80 48 L64 104 Z" fill="#ffffff" opacity="0.18"/>
  <!-- Growth Sparkline Arrow -->
  <path d="M26 86 L50 70 L70 80 L102 44" fill="none" stroke="url(#spark)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="102" cy="44" r="5" fill="#10b981"/>
</svg>
